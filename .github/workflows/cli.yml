name: CLI

on:
  push:
    branches: [main, sense-usb-lan]
    tags: ["cli-v*"]
    paths: ["cli/**", ".github/workflows/cli.yml", "hardware/hid_bridge/cli_*", "hardware/hid_bridge/usb_pairing.h", "hardware/hid_bridge/src/cli/**", "hardware/tests/sim/**"]
  pull_request:
    paths: ["cli/**", ".github/workflows/cli.yml", "hardware/hid_bridge/cli_*", "hardware/hid_bridge/usb_pairing.h", "hardware/hid_bridge/src/cli/**", "hardware/tests/sim/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, goos: darwin, goarch: arm64, cgo: "1" }
          - { runner: windows-2025, goos: windows, goarch: amd64, cgo: "0" }
          # The firmware simulator requires the mbedTLS 3.x headers shipped in 26.04.
          - { runner: ubuntu-26.04, goos: linux, goarch: amd64, cgo: "0" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Install native test dependencies
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg mbedtls@3 ;;
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg libmbedtls-dev ;;
            Windows) if ! command -v ffmpeg >/dev/null; then choco install ffmpeg -y --no-progress; fi ;;
          esac
      - name: Build the simulated board
        if: runner.os != 'Windows'
        run: make -C ../hardware/tests/sim cli_sim screen.h264
      - uses: astral-sh/setup-uv@v6
        if: runner.os != 'Windows'
      - name: Test the simulated board protocol
        if: runner.os != 'Windows'
        run: uv run ../hardware/tests/sim/test_cli_sim.py
      - run: go vet ./...
      - name: Test the native CLI
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then go test ./...; else go test -race ./...; fi
      - name: Build, verify and package the executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          if [[ "$GOOS" == darwin ]]; then
            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            export MACOSX_DEPLOYMENT_TARGET=15.0
            export CC="clang -arch $GOARCH" CXX="clang++ -arch $GOARCH"
          else
            test "$host" = "$GOOS/$GOARCH"
          fi
          version="0.0.0-dev.${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#cli-v}
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          fi
          exe=esp32agent
          if [[ "$GOOS" == windows ]]; then exe=esp32agent.exe; fi
          mkdir -p dist/pkg
          binary="dist/pkg/$exe"
          go build -trimpath -ldflags "-s -w -X github.com/onehumanbeing/esp32-iphone-agent/cli/internal/app.Version=$version" -o "$binary" ./cmd/esp32agent
          if [[ "$GOOS" == darwin ]]; then
            test "$(lipo -archs "$binary")" = "$GOARCH"
            otool -L "$binary" | grep -F 'CoreBluetooth.framework/'
            if ! codesign --verify "$binary"; then codesign --force --sign - "$binary"; fi
            codesign --verify --strict --verbose=2 "$binary"
          fi
          if [[ "$host" == "$GOOS/$GOARCH" ]]; then
            "$binary" version | python -c 'import json,sys; assert json.load(sys.stdin)["data"]["version"] == sys.argv[1]' "$version"
          fi
          archive="esp32agent_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd dist/pkg && python -m zipfile -c "../$archive.zip" "$exe")
          else
            tar -czf "dist/$archive.tar.gz" -C dist/pkg "$exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: esp32agent_${{ matrix.goos }}_${{ matrix.goarch }}
          path: cli/dist/esp32agent_*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-24.04
    concurrency: cli-release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: esp32agent_*
          path: dist
          merge-multiple: true
      - name: Generate release manifest and checksums
        working-directory: dist
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("cli-v")
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          files = sorted(pathlib.Path(".").glob("esp32agent_*"))
          expected = {"esp32agent_darwin_arm64.tar.gz", "esp32agent_linux_amd64.tar.gz", "esp32agent_windows_amd64.zip"}
          if {f.name for f in files} != expected:
              raise SystemExit("Unexpected archive set")
          assets = {}
          sums = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              key = path.name.removeprefix("esp32agent_").split(".", 1)[0]
              assets[key] = {"url": f"{base}/{path.name}", "sha256": digest}
              sums.append(f"{digest}  {path.name}\n")
          release = {"version": version, "date": datetime.date.today().isoformat(), "assets": assets}
          pathlib.Path("checksums.txt").write_text("".join(sums))
          pathlib.Path("versions.json").write_text(json.dumps({"latest": version, "versions": [release]}, indent=2) + "\n")
          PY
      - name: Publish complete CLI release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          if draft=$(gh release view "$tag" -R "$repo" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              diff <(printf '%s\n' esp32agent_* checksums.txt versions.json | sort) <(gh release view "$tag" -R "$repo" --json assets --jq '.assets[].name' | sort)
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" -R "$repo" --verify-tag --draft --title "esp32agent ${tag#cli-v}" --notes "Native CLI for macOS arm64, Windows x64 and Linux x64."
          fi
          gh release upload "$tag" -R "$repo" --clobber esp32agent_* checksums.txt versions.json
          gh release edit "$tag" -R "$repo" --draft=false
